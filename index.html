<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>מנהל פרויקטים - מכשור רפואי</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B57D0">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0e1320; --panel:#161c2c; --panel2:#1f2740; --border:#2b3350;
    --text:#eef1fb; --muted:#9aa3c4; --accent:#6da8ff; --primary:#3d8bff; --primary-container:#1b2f57;
    --green:#3ddc84; --yellow:#ffca43; --red:#ff5a5f; --radius:18px; --radius-sm:12px;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#f5f6fb; --panel:#ffffff; --panel2:#eef1fc; --border:#dfe3f2;
    --text:#171b2e; --muted:#5c6584; --accent:#0B57D0; --primary:#0B57D0; --primary-container:#dbe6ff;
    --shadow:0 2px 10px rgba(20,30,70,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  }
  header h1{font-size:17px; margin:0; font-weight:700; display:flex; align-items:center; gap:10px;}
  .hdr-logo{width:30px; height:30px; border-radius:50%; flex:none;}
  .tabs{display:flex; gap:8px; overflow-x:auto;}
  .tab{padding:7px 14px; border-radius:999px; background:var(--panel2); color:var(--muted); font-size:13px; white-space:nowrap; cursor:pointer; border:1px solid var(--border);}
  .tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  main{padding:12px 12px 90px;}
  .banner{background:linear-gradient(135deg,#3a2210,#4a2a10); border:1px solid #8a4b12; color:#ffcf8a; border-radius:var(--radius); padding:10px 14px; margin-bottom:12px; font-size:13px; cursor:pointer;}
  .banner.empty{display:none;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .card h3{margin:0 0 4px; font-size:15px; font-weight:700;}
  .muted{color:var(--muted); font-size:12px;}
  .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .btn{background:var(--primary); color:#fff; border:none; border-radius:999px; padding:9px 16px; font-size:13px; cursor:pointer; font-weight:600;}
  .btn.secondary{background:var(--primary-container); color:var(--primary); border:none;}
  .btn.danger{background:#3a1414; color:#ff9d9d; border:1px solid #6b2323;}
  .btn.small{padding:6px 11px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .fab{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:16px; background:var(--primary); color:#fff; border:none; width:56px; height:56px; border-radius:28px; font-size:26px; box-shadow:0 4px 16px rgba(0,0,0,.4); z-index:20;}
  .menu-fab{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); right:16px; background:var(--primary); color:#fff; border:none; width:56px; height:56px; border-radius:28px; font-size:24px; box-shadow:0 4px 16px rgba(0,0,0,.4); z-index:42; transition:transform 150ms ease;}
  .menu-fab.open{transform:rotate(90deg);}
  .nav-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:39; opacity:0; pointer-events:none; transition:opacity 200ms ease;}
  .nav-backdrop.show{opacity:1; pointer-events:auto;}
  .sort-menu{position:fixed; z-index:60; min-width:170px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:6px; box-shadow:0 8px 28px rgba(0,0,0,.4);}
  .sort-menu .opt{display:flex; justify-content:space-between; gap:14px; padding:11px 12px; border-radius:10px; font-size:14px; font-weight:600; color:var(--text); cursor:pointer;}
  .sort-menu .opt.on{background:var(--primary-container); color:var(--primary);}
  .menu-bubble{position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); min-width:210px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:8px; z-index:41; box-shadow:0 8px 28px rgba(0,0,0,.4); opacity:0; transform:scale(.85) translateY(10px); transform-origin:bottom right; pointer-events:none; transition:opacity 150ms ease, transform 150ms ease;}
  .menu-bubble.show{opacity:1; transform:none; pointer-events:auto;}
  .menu-bubble .nav-link{display:block; padding:12px 14px; border-radius:12px; font-size:15px; font-weight:700; color:var(--text); cursor:pointer;}
  .menu-bubble .nav-link.active{background:var(--primary-container); color:var(--primary);}
  input,select,textarea{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:9px 11px; font-size:14px; width:100%; font-family:inherit;
  }
  label{font-size:12px; color:var(--muted); display:block; margin:8px 0 3px; font-weight:600;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; opacity:0; transition:opacity 140ms ease;}
  .modal-bg.show{opacity:1;}
  .modal{background:var(--panel); border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateY(24px); transition:transform 140ms ease;}
  .modal-bg.show .modal{transform:translateY(0);}
  .modal.center{border-radius:20px; margin-bottom:auto; margin-top:15vh;}
  .modal h2{margin-top:0; font-size:17px;}
  .chip{display:inline-flex; align-items:center; gap:5px; background:var(--primary-container); color:var(--primary); border:none; border-radius:999px; padding:4px 10px; font-size:12px; margin:2px; font-weight:600;}
  .chip button{background:none; border:none; color:inherit; cursor:pointer; font-size:13px; padding:0; opacity:.7;}
  .tree-item{border-right:2px solid var(--border); padding-right:12px; margin-top:10px;}
  .status-pill{display:inline-block; padding:1px 8px; border-radius:999px; font-size:10px; font-weight:700; margin-left:6px;}
  .status-open .status-pill{background:#4a3a12; color:var(--yellow);}
  .status-done .status-pill{background:#123a26; color:var(--green);}
  .status-overdue .status-pill{background:#4a1414; color:var(--red);}
  :root[data-theme="light"] .status-open .status-pill{background:#fff2cf;}
  :root[data-theme="light"] .status-done .status-pill{background:#d8f7e6;}
  :root[data-theme="light"] .status-overdue .status-pill{background:#ffe0e0;}
  .item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
  .item-title{font-size:14px; font-weight:700; cursor:pointer;}
  .item-title.done{text-decoration:line-through; color:var(--muted);}
  .item-meta{font-size:11px; color:var(--muted); margin-top:3px;}
  .icon-btn{background:none; border:none; color:var(--muted); font-size:17px; cursor:pointer; padding:4px 6px;}
  .empty-state{text-align:center; color:var(--muted); padding:40px 10px; font-size:14px;}
  .footer-note{font-size:11px; color:var(--muted); text-align:right; line-height:1.6;}
  .subtabs{display:flex; gap:6px; margin-bottom:10px;}
  .subtab{padding:6px 12px; border-radius:999px; background:var(--panel2); color:var(--muted); font-size:12px; cursor:pointer; border:1px solid var(--border);}
  .subtab.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .reminder-row{display:flex; gap:6px; align-items:center;}
  .reminder-row input{flex:1;}
  .contact-link{display:block; text-align:center; margin-bottom:6px; text-decoration:none;}
  .progress-bar{height:8px; border-radius:999px; background:var(--panel2); overflow:hidden; margin-top:6px;}
  .progress-fill{height:100%; background:var(--primary); border-radius:999px;}
  .quicklinks{display:flex; gap:8px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px;}
  .quicklinks .btn{white-space:nowrap;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat-card{background:var(--panel2); border-radius:var(--radius-sm); padding:10px; text-align:center;}
  .stat-card .num{font-size:22px; font-weight:800; color:var(--primary);}
  .stat-card .lbl{font-size:11px; color:var(--muted); margin-top:2px;}
  .day-block{margin-top:8px;}
  .day-block h4{font-size:12px; color:var(--muted); margin:0 0 4px;}
  [data-toggle-collapse]{transition:transform 140ms ease; display:inline-block;}
  #main.tab-fade{animation:fadeIn 150ms ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .accordion-head{cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .accordion-arrow{transition:transform 140ms ease;}
  .accordion-body{overflow:hidden; max-height:0; transition:max-height 160ms ease;}
  .accordion-body.open{max-height:2000px;}
</style>
<style id="theme-shadcn">
  /* shadcn/ui-style tokens (zinc) */
  :root{ --bg:#ffffff; --panel:#ffffff; --panel2:#f4f4f5; --border:#e4e4e7; --text:#09090b; --muted:#71717a;
    --accent:#18181b; --primary:#18181b; --primary-container:#f4f4f5; --green:#16a34a; --yellow:#d97706; --red:#dc2626;
    --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(0,0,0,.05); --ios:#007aff; --ios-soft:rgba(0,122,255,.12);
    --glass:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.75); --on-primary:#fafafa; }
  :root[data-theme="light"]{ --bg:#ffffff; --panel:#ffffff; --panel2:#f4f4f5; --border:#e4e4e7; --text:#09090b; --muted:#71717a;
    --accent:#18181b; --primary:#18181b; --primary-container:#f4f4f5; --shadow:0 1px 2px rgba(0,0,0,.05);
    --glass:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.75); --on-primary:#fafafa; --ios:#007aff; --ios-soft:rgba(0,122,255,.12); }
  :root[data-theme="dark"]{ --bg:#09090b; --panel:#0c0c0f; --panel2:#18181b; --border:#27272a; --text:#fafafa; --muted:#a1a1aa;
    --accent:#fafafa; --primary:#fafafa; --primary-container:#27272a; --green:#22c55e; --yellow:#f59e0b; --red:#ef4444; --shadow:none;
    --glass:rgba(32,32,36,.66); --glass-line:rgba(255,255,255,.12); --on-primary:#09090b; --ios:#0a84ff; --ios-soft:rgba(10,132,255,.2); }
  body{ font-family:-apple-system,"SF Pro Text",Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif; letter-spacing:-.005em; }
  header{ background:var(--bg); }
  .card{ box-shadow:var(--shadow); padding:16px; }
  .card h3{ font-weight:600; letter-spacing:-.01em; }
  .btn{ border-radius:8px; font-weight:500; padding:8px 14px; color:var(--on-primary); }
  .btn.secondary{ background:var(--bg); color:var(--text); border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .btn.danger{ background:var(--bg); color:var(--red); border:1px solid var(--border); }
  .btn.small{ padding:5px 10px; }
  .tab{ border-radius:6px; background:transparent; border:none; font-weight:500; padding:6px 12px; color:var(--muted); }
  .tab.active{ background:var(--bg); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); border:none; }
  .subtab{ border-radius:6px; background:transparent; border:none; font-weight:500; }
  .subtab.active{ background:var(--bg); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .stat-card{ background:var(--bg); border:1px solid var(--border); border-radius:10px; text-align:start; padding:14px; }
  .stat-card .num{ font-weight:700; letter-spacing:-.02em; color:var(--text); }
  .chip{ border-radius:6px; background:var(--panel2); color:var(--text); font-weight:500; }
  input,select,textarea{ border-radius:8px; background:var(--bg); border:1px solid var(--border); }
  input[type=checkbox],input[type=radio]{ background:initial; border:initial; }
  .progress-bar{ height:6px; background:var(--panel2); } .progress-fill{ background:var(--primary); }
  .banner{ background:#fffbeb; border:1px solid #fcd34d; color:#92400e; border-radius:var(--radius); }
  :root[data-theme="dark"] .banner{ background:#1c1608; border-color:#78350f; color:#fcd34d; }
  .modal{ border-radius:20px 20px 0 0; background:var(--panel); border:1px solid var(--border); border-bottom:none; }
  .modal.center{ border-radius:16px; border-bottom:1px solid var(--border); }
  .status-open .status-pill{ background:#fef3c7; color:#b45309; } .status-done .status-pill{ background:#dcfce7; color:#15803d; } .status-overdue .status-pill{ background:#fee2e2; color:#b91c1c; }
  :root[data-theme="dark"] .status-open .status-pill{ background:#3a2a08; color:#fbbf24; } :root[data-theme="dark"] .status-done .status-pill{ background:#0f2a1a; color:#4ade80; } :root[data-theme="dark"] .status-overdue .status-pill{ background:#3b1212; color:#f87171; }
  .sort-menu{ border-radius:14px; box-shadow:0 8px 28px rgba(0,0,0,.18); } .sort-menu .opt{ border-radius:8px; font-weight:500; }
  .sort-menu .opt.on{ background:var(--ios-soft); color:var(--ios); }

  /* iOS-style floating glass bar */
  .fab,.menu-fab{ display:none !important; }
  main{ padding-bottom:calc(112px + env(safe-area-inset-bottom,0px)); }
  .dock{ position:fixed; left:14px; right:14px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; z-index:40; align-items:center; pointer-events:none; }
  .dock > *{ pointer-events:auto; }
  .glass{ background:var(--glass); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); border:.5px solid var(--glass-line); box-shadow:0 8px 28px rgba(0,0,0,.16), inset 0 0 0 .5px rgba(0,0,0,.05); }
  .cap{ flex:1; height:64px; border-radius:32px; display:flex; padding:5px; gap:2px; align-items:stretch; }
  .cap.solo{ flex:none; }
  .bt{ flex:1; min-width:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:27px; color:var(--muted); font-size:10px; font-weight:600; letter-spacing:.01em; background:none; border:none; font-family:inherit; cursor:pointer; padding:0 6px; -webkit-tap-highlight-color:transparent; }
  .bt svg{ display:block; }
  .bt.on{ background:rgba(120,120,128,.16); color:var(--ios); }
  .bt:active{ background:rgba(120,120,128,.16); }
  .bsearch{ flex:1; display:flex; align-items:center; gap:6px; padding:0 4px 0 6px; color:var(--muted); min-width:0; }
  .bsearch input{ flex:1; min-width:0; border:none; background:transparent; font-size:16px; padding:8px 4px; color:var(--text); outline:none; box-shadow:none; }
  .bsearch button{ border:none; background:rgba(120,120,128,.2); color:var(--muted); width:26px; height:26px; border-radius:50%; font-size:13px; cursor:pointer; flex:none; }
  .bsearch input::-webkit-search-cancel-button,.bsearch input::-webkit-search-decoration{ -webkit-appearance:none; appearance:none; display:none; }
  .round{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; background:var(--ios); border:none; box-shadow:0 8px 24px rgba(0,122,255,.38); cursor:pointer; flex:none; }
  .round:active{ transform:scale(.96); }
  .menu-bubble{ right:14px; bottom:calc(88px + env(safe-area-inset-bottom,0px)); border-radius:20px; background:var(--glass); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); border:.5px solid var(--glass-line); box-shadow:0 8px 28px rgba(0,0,0,.2); z-index:45; }
  .menu-bubble .nav-link{ font-weight:600; font-size:15px; }
  .menu-bubble .nav-link.active{ background:var(--ios-soft); color:var(--ios); }
  .nav-backdrop{ z-index:44; }
</style>
</head>
<body>

<header>
  <h1><img class="hdr-logo" src="icon-192.png" alt=""><span id="pageTitle">דשבורד</span></h1>
</header>

<div class="nav-backdrop" id="navBackdrop"></div>
<div class="menu-bubble" id="menuBubble">
  <div class="nav-link" data-nav="dashboard">🏠 דשבורד</div>
  <div class="nav-link" data-nav="projects">📁 פרויקטים</div>
  <div class="nav-link" data-nav="contacts">👤 אנשי קשר</div>
  <div class="nav-link" data-nav="docs">📄 מסמכים</div>
  <div class="nav-link" data-nav="settings">⚙️ הגדרות וגיבוי</div>
</div>

<main id="main"></main>

<button class="fab" id="fab">+</button>
<button class="menu-fab" id="menuFab" aria-label="תפריט">☰</button>
<div class="dock" id="bar"></div>

<script>
/* ================= Data layer ================= */
const STORE_KEY = 'pm_data_v3';
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { projects: [], contacts: [], companies: [], quickLinks: [] };
}
/* ================= App version ================= */
/* Bumped by Claude on every file update - same timestamp used in the delivered zip filename.
   If this number doesn't change after you refresh, the browser is still serving a cached copy. */
const APP_VERSION = '2026-10-04_2108';

let DATA = loadData();
if(!DATA.companies) DATA.companies = [];
if(!DATA.quickLinks) DATA.quickLinks = [];
if(!DATA.files) DATA.files = [];
if(!DATA.docs) DATA.docs = [];
if(!DATA.docCats) DATA.docCats = [];
function save(){ purgeFiles(); localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================= Documents (links library) ================= */
let docSearch = '';
let docTagFilter = [];
const DOC_OFFSET_CHOICES = [[0,'ביום התפוגה'],[1,'יום לפני'],[3,'3 ימים לפני'],[7,'שבוע לפני'],[14,'שבועיים לפני'],[30,'חודש לפני']];
function getDocOffsets(){
  try{ const a = JSON.parse(localStorage.getItem('pm_doc_offsets')||'null'); if(Array.isArray(a)) return a.filter(n=>Number.isInteger(n)&&n>=0&&n<=365); }catch(e){}
  return [7];
}
function getDocAlertTime(){ return localStorage.getItem('pm_doc_alert_time') || '09:00'; }
function getClosedDocGroups(){ try{ return new Set(JSON.parse(localStorage.getItem('pm_doc_closed')||'[]')); }catch(e){ return new Set(); } }
function setClosedDocGroups(set){ try{ localStorage.setItem('pm_doc_closed', JSON.stringify([...set])); }catch(e){} }
function startOfToday(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseYmd(str){ const a = String(str).split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function ymd(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function fmtYmd(str){ const a = String(str).split('-'); return `${a[2]}/${a[1]}/${a[0]}`; }
function docDaysLeft(doc){ if(!doc.expiry) return null; return Math.round((parseYmd(doc.expiry) - startOfToday())/86400000); }
function docWarnDays(){ const o = getDocOffsets(); return o.length ? Math.max(...o) : 7; }
function normalizeUrl(u){
  u = (u||'').trim(); if(!u) return '';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try{ const x = new URL(u); if(x.protocol!=='http:' && x.protocol!=='https:') return ''; return x.href; }catch(e){ return ''; }
}
function urlHost(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function docSourceLabel(u){
  const h = urlHost(u);
  if(/(^|\.)(drive|docs)\.google\.com$/.test(h)) return 'Google Drive';
  if(/(^|\.)notion\.(so|site)$/.test(h)) return 'Notion';
  if(/(^|\.)dropbox\.com$/.test(h)) return 'Dropbox';
  if(/(onedrive\.live\.com|1drv\.ms|sharepoint\.com)$/.test(h)) return 'OneDrive / SharePoint';
  return h;
}
function docCatName(id){ const c = DATA.docCats.find(x=>x.id===id); return c ? c.name : ''; }
function allDocTags(){
  const m = new Map();
  DATA.docs.forEach(d=> (d.tags||[]).forEach(t=>{ const k = t.toLowerCase(); if(!m.has(k)) m.set(k,t); }));
  return [...m.values()].sort((a,b)=> a.localeCompare(b,'he'));
}
function sortDocs(list){
  const so = getSort(); if(so==='created') return list;
  const a = list.slice();
  if(so==='name') a.sort((x,y)=> x.name.localeCompare(y.name,'he'));
  else a.sort((x,y)=>{ if(x.expiry===y.expiry) return 0; if(!x.expiry) return 1; if(!y.expiry) return -1; return x.expiry<y.expiry?-1:1; });
  return a;
}
function docMatches(d, q){
  return (d.name+' '+(d.note||'')+' '+urlHost(d.url)+' '+(d.tags||[]).join(' ')+' '+docCatName(d.catId)).toLowerCase().includes(q);
}
function docExpiryBadge(doc){
  const n = docDaysLeft(doc); if(n===null) return '';
  const base = 'font-size:12px; font-weight:600; margin-top:4px;';
  if(n<0) return `<div style="${base} color:var(--red);">❌ פג תוקף ב-${fmtYmd(doc.expiry)}</div>`;
  if(n===0) return `<div style="${base} color:var(--red);">⚠️ פג תוקף היום</div>`;
  if(n<=docWarnDays()) return `<div style="${base} color:#e08a00;">⏳ תוקף עד ${fmtYmd(doc.expiry)} (עוד ${n} ${n===1?'יום':'ימים'})</div>`;
  return `<div class="muted" style="font-size:12px; margin-top:4px;">🗓️ תוקף עד ${fmtYmd(doc.expiry)}</div>`;
}
function docIsAttention(doc){ const n = docDaysLeft(doc); return n!==null && n <= docWarnDays(); }
function docCardHtml(d){
  const tags = (d.tags||[]).map(t=>`<span class="chip" data-tagf="${esc(t)}" style="cursor:pointer;">#${esc(t)}</span>`).join(' ');
  const host = urlHost(d.url);

        <div class="muted" style="font-size:11px;"><img src="https://www.google.com/s2/favicons?sz=32&domain=${encodeURIComponent(host)}" alt="" style="width:14px;height:14px;vertical-align:middle;border-radius:3px;" onerror="this.style.display='none'"> ${esc(docSourceLabel(d.url))}</div>

}
function docsListInner(){
  const q = docSearch.trim().toLowerCase();
  const tf = docTagFilter.map(t=>t.toLowerCase());
  const filtering = !!q || tf.length>0;
  let list = DATA.docs.filter(d=> (!q || docMatches(d,q)) && tf.every(t=> (d.tags||[]).some(x=>x.toLowerCase()===t)));
  list = sortDocs(list);
  const closed = getClosedDocGroups();
  const groups = DATA.docCats.map(c=>({key:c.id, title:c.name, docs:list.filter(d=>d.catId===c.id)}));
  const none = list.filter(d=> !DATA.docCats.some(c=>c.id===d.catId));
  if(none.length) groups.push({key:'__none', title:'ללא קטגוריה', docs:none});
  const tags = allDocTags();
  const tagBar = tags.length ? `<div style="margin-bottom:8px;">${tags.map(t=>{
    const on = tf.includes(t.toLowerCase());
    return `<span class="chip" data-tagf="${esc(t)}" style="cursor:pointer; ${on?'background:var(--primary); color:#fff;':''}">#${esc(t)}</span>`;
  }).join(' ')}${tf.length?` <button class="btn small secondary" data-tag-clear>נקה סינון</button>`:''}</div>` : '';
  let body;
  if(DATA.docs.length===0){
    body = `<div class="empty-state">אין עדיין קישורים.<br>לחץ על + כדי להוסיף קישור למסמך או לתיקייה.</div>`;
  } else {
    body = groups.filter(g=> g.docs.length || !filtering).map(g=>{
      const open = filtering || !closed.has(g.key);
      const att = g.docs.filter(docIsAttention).length;
      return `<div class="card" style="padding:0;">
        <div class="item-head" data-doc-group="${esc(g.key)}" style="padding:12px 14px; cursor:pointer;">
          <h3>${open?'▾':'◂'} ${esc(g.title)}</h3>
          <span class="muted">${g.docs.length} קישורים${att?` · <span style="color:#e08a00">⚠️ ${att}</span>`:''}</span>
        </div>
        ${open?`<div style="padding:0 10px 10px;">${g.docs.map(docCardHtml).join('') || '<div class="muted" style="padding:6px;">אין קישורים בקטגוריה</div>'}</div>`:''}
      </div>`;
    }).join('') || '<div class="empty-state">לא נמצאו תוצאות.</div>';
  }
  return `${tagBar}${body}`;
}
function bindDocs(){
  main.querySelectorAll('[data-tagf]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.dataset.tagf, k = t.toLowerCase();
      const i = docTagFilter.findIndex(x=>x.toLowerCase()===k);
      if(i>-1) docTagFilter.splice(i,1); else docTagFilter.push(t);
      renderDocsListOnly();
    });
  });
  main.querySelectorAll('[data-tag-clear]').forEach(el=> el.addEventListener('click', ()=>{ docTagFilter = []; renderDocsListOnly(); }));
  main.querySelectorAll('[data-doc-group]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const set = getClosedDocGroups(); const k = el.dataset.docGroup;
      if(set.has(k)) set.delete(k); else set.add(k);
      setClosedDocGroups(set); renderDocsListOnly();
    });
  });
  main.querySelectorAll('[data-doc-edit]').forEach(el=> el.addEventListener('click', ()=>{ const d = DATA.docs.find(x=>x.id===el.dataset.docEdit); if(d) openDocModal(d); }));
  main.querySelectorAll('[data-doc-copy]').forEach(el=> el.addEventListener('click', async ()=>{
    const d = DATA.docs.find(x=>x.id===el.dataset.docCopy); if(!d) return;
    const ok = await copyText(d.url);
    el.textContent = ok ? '✔️' : '⚠️';
    setTimeout(()=>{ el.textContent = '📋'; }, 1200);
  }));
  const cb = document.getElementById('docCatsBtn'); if(cb) cb.onclick = ()=> openDocCatsModal();
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(e2){}
    ta.remove(); return ok;
  }
}
function renderDocs(){
  main.innerHTML = `
    <div id="docsInner">${docsListInner()}</div>`;
  bindDocs();
}
function renderDocsListOnly(){
  const inner = document.getElementById('docsInner');
  if(!inner){ renderDocs(); return; }
  inner.innerHTML = docsListInner();
  bindDocs();
}

/* ---- Document expiry alerts: only on workdays; a non-workday moves back to the previous workday ---- */
function docAlertDates(doc){
  if(!doc.expiry) return [];
  const exp = parseYmd(doc.expiry); if(isNaN(exp.getTime())) return [];
  const wd = getWorkdays();
  const tm = getDocAlertTime().split(':').map(Number);
  const seen = new Set(); const out = [];
  for(const off of getDocOffsets()){
    let d = new Date(exp.getFullYear(), exp.getMonth(), exp.getDate()-off);
    if(wd.length){ let g = 0; while(!wd.includes(d.getDay()) && g++ < 7) d = new Date(d.getFullYear(), d.getMonth(), d.getDate()-1); }
    d.setHours(tm[0]||0, tm[1]||0, 0, 0);
    const key = toLocalInputValue(d);
    if(seen.has(key)) continue;
    seen.add(key); out.push({key, when: d});
  }
  return out;
}
function suppressPastDocAlerts(onlyDoc){
  const now = new Date();
  (onlyDoc ? [onlyDoc] : DATA.docs).forEach(d=>{
    d.alertsFired = docAlertDates(d).filter(a=>a.when <= now).map(a=>a.key);
  });
  if(!onlyDoc) save();
}
function fireDocNotification(doc){
  const n = docDaysLeft(doc);
  const when = n===0 ? 'היום' : (n===1 ? 'מחר' : `בעוד ${n} ימים`);
  const title = `📄 תוקף מסמך: ${doc.name}`;
  const opts = { body: `פג תוקף ${when} (${fmtYmd(doc.expiry)})`, icon:'icon-192.png', badge:'icon-192.png', tag:'doc-'+doc.id, data:{ docId: doc.id } };
  if('serviceWorker' in navigator && navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type:'SHOW_NOTIFICATION', title, options: opts});
  } else if('Notification' in window && Notification.permission==='granted'){
    try{ const nt = new Notification(title, opts); nt.onclick = ()=>{ window.focus(); goToTab('docs'); nt.close(); }; }catch(e){}
  }
}
function checkDocAlerts(){
  const now = new Date(); const today = ymd(now); let changed = false;
  for(const doc of (DATA.docs||[])){
    if(!doc.expiry || doc.expiry < today) continue;
    if(!doc.alertsFired) doc.alertsFired = [];
    const due = docAlertDates(doc).filter(a=> a.when <= now && !doc.alertsFired.includes(a.key));
    if(due.length){
      fireDocNotification(doc);
      due.forEach(a=> doc.alertsFired.push(a.key));
      changed = true;
    }
  }
  return changed;
}

/* ---- Snooze for task notifications (moves only the notification, never the due date) ---- */
function snoozeItem(projectId, itemId, minutes, atLocal){

  const at = atLocal || toLocalInputValue(new Date(Date.now() + minutes*60000));

/* ================= Attached files (IndexedDB) ================= */
const FILE_INFO = {};   // id -> meta of every blob that exists on this device
const MAX_FILE_BYTES = 50*1024*1024;
let _idb = null;
function idb(){
  return _idb || (_idb = new Promise((res,rej)=>{
    const r = indexedDB.open('pm_files',1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('files',{keyPath:'id'});
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  }));
}
function idbTx(mode, fn){
  return idb().then(db=> new Promise((res,rej)=>{
    const t = db.transaction('files',mode);
    const rq = fn(t.objectStore('files'));
    t.oncomplete = ()=> res(rq && rq.result);
    t.onerror = ()=> rej(t.error);
    t.onabort = ()=> rej(t.error);
  }));
}
const idbPut = rec => idbTx('readwrite', st=>st.put(rec));
const idbGet = id => idbTx('readonly', st=>st.get(id));
const idbDel = id => idbTx('readwrite', st=>st.delete(id)).catch(()=>{});
const idbAll = () => idbTx('readonly', st=>st.getAll());
function loadFileInfo(){
  idbAll().then(rs=>{
    (rs||[]).forEach(r=>{ FILE_INFO[r.id] = r.meta; });
    if((rs||[]).length || DATA.files.length) render();
  }).catch(()=>{});
}
function fmtSize(b){
  if(b < 1024) return b+' B';
  if(b < 1048576) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
function fileIcon(f){
  const t = (f.type||'').toLowerCase();
  if(t.startsWith('video/')) return '🎬';
  if(t.startsWith('audio/')) return '🎵';
  if(t==='application/pdf') return '📕';
  if(t.startsWith('text/')) return '📄';
  return '📎';
}
function ownerExists(f){
  const p = findProject(f.projectId); if(!p) return false;
  if(!f.itemId) return true;
  const it = findItem(p.tasks, f.itemId); if(!it) return false;
  if(!f.updateId) return true;
  return (it.updates||[]).some(u=>u.id===f.updateId);
}
function purgeFiles(){
  if(!DATA.files || !DATA.files.length) return;
  const gone = DATA.files.filter(f=>!ownerExists(f));
  if(!gone.length) return;
  DATA.files = DATA.files.filter(f=>ownerExists(f));
  gone.forEach(f=>{ idbDel(f.id); delete FILE_INFO[f.id]; });
}
function ownerLabel(f){
  if(!DATA.files.some(x=>x.id===f.id)) return 'לא משויך (ייבא קובץ גיבוי JSON כדי לשייך)';
  const p = findProject(f.projectId); if(!p) return 'לא משויך';
  let t = p.name;
  if(f.itemId){
    const path = findPathToItem(p.tasks, f.itemId);
    if(!path) return 'לא משויך';
    t += ' › ' + path.map(x=>x.title).join(' › ');
    if(f.updateId) t += ' › עדכון';
  }
  return t;
}
function filesFor(o){
  return DATA.files.filter(f=> f.projectId===o.projectId && (f.itemId||'')===(o.itemId||'') && (f.updateId||'')===(o.updateId||''));
}
function getFileMeta(id){ return DATA.files.find(x=>x.id===id) || FILE_INFO[id]; }
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
}
async function addFiles(list, o, done){
  const bad = [];
  for(const f of list){
    if(f.size > MAX_FILE_BYTES){ bad.push(f.name); continue; }
    const id = uid();
    const meta = { id, name: f.name || ('photo_'+Date.now()+'.jpg'), size: f.size, type: f.type||'',
      added: toLocalInputValue(new Date()), projectId: o.projectId, itemId: o.itemId||'', updateId: o.updateId||'' };
    try{ await idbPut({id, blob: f, meta}); }catch(e){ alert('שמירת הקובץ נכשלה: '+meta.name); continue; }
    FILE_INFO[id] = meta; DATA.files.push(meta);
  }
  save();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(bad.length) alert('קבצים הגדולים מ-50MB לא נוספו:\n'+bad.join('\n'));
  done();
}
function pickFiles(camera, cb){
  const i = document.createElement('input');
  i.type = 'file';
  if(camera){ i.accept = 'image/*'; i.setAttribute('capture','environment'); } else i.multiple = true;
  i.onchange = ()=>{ if(i.files && i.files.length) cb([...i.files]); };
  i.click();
}

async function openFileViewer(f){
  const r = await idbGet(f.id);
  if(!r){ alert('הקובץ חסר'); return; }
  const blob = r.blob;
  const t = (f.type || blob.type || '').toLowerCase();
  const ext = (f.name.split('.').pop()||'').toLowerCase();
  const isText = t.startsWith('text/') || ['txt','csv','json','md','log','xml'].includes(ext);
  if(t.startsWith('image/') || t.startsWith('video/') || t.startsWith('audio/') || isText){
    const url = URL.createObjectURL(blob);
    let inner;
    if(t.startsWith('image/')) inner = `<div style="overflow:auto; max-height:70vh;"><img id="vwImg" src="${url}" style="max-width:100%; cursor:zoom-in;"></div><div class="muted" style="margin-top:4px;">לחיצה על התמונה מגדילה / מקטינה</div>`;
    else if(t.startsWith('video/')) inner = `<video controls src="${url}" style="max-width:100%; max-height:70vh;"></video>`;
    else if(t.startsWith('audio/')) inner = `<audio controls src="${url}" style="width:100%;"></audio>`;
    else { const txt = (await blob.text()).slice(0,500000); inner = `<pre style="white-space:pre-wrap; max-height:70vh; overflow:auto; font-size:12px;">${esc(txt)}</pre>`; }
    const bg = openModalEl(`<h2 style="font-size:15px; word-break:break-all;">${esc(f.name)}</h2>${inner}<div class="row" style="margin-top:12px;"><button class="btn secondary" id="vwClose">סגירה</button></div>`);
    bg.querySelector('#vwClose').onclick = ()=>{ closeModal(bg); setTimeout(()=>URL.revokeObjectURL(url), 400); };
    const im = bg.querySelector('#vwImg');
    if(im) im.onclick = ()=>{
      const big = im.style.maxWidth==='none';
      im.style.maxWidth = big ? '100%' : 'none';
      im.style.width = big ? '' : '250%';
      im.style.cursor = big ? 'zoom-in' : 'zoom-out';
    };
    return;
  }
  // PDF, Word, Excel, etc.: hand over to an app on the device (share sheet), otherwise download
  const file = new File([blob], f.name, {type: t || 'application/octet-stream'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title: f.name}); }catch(e){}
    return;
  }
  downloadBlob(blob, f.name);
}

/* ---- ZIP (store only, no compression) ---- */
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function zipBuild(entries){
  const enc = new TextEncoder(); const parts = []; const cen = []; let off = 0;
  for(const e of entries){
    const nameB = enc.encode(e.name);
    const data = new Uint8Array(await e.blob.arrayBuffer());
    const crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,size,true);
    lh.setUint32(22,size,true); lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer, nameB, e.blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,nameB.length,true);
    ch.setUint32(42,off,true);
    cen.push(ch.buffer, nameB);
    off += 30 + nameB.length + size;
  }
  let cdSize = 0; cen.forEach(x=>{ cdSize += x.byteLength; });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...cen, end.buffer], {type:'application/zip'});
}
async function zipRead(file){
  const tailLen = Math.min(file.size, 65557);
  const tail = new DataView(await file.slice(file.size-tailLen).arrayBuffer());
  let p = -1;
  for(let i=tailLen-22;i>=0;i--){ if(tail.getUint32(i,true)===0x06054b50){ p=i; break; } }
  if(p<0) throw new Error('bad zip');
  const n = tail.getUint16(p+10,true), cdSize = tail.getUint32(p+12,true), cdOff = tail.getUint32(p+16,true);
  const cd = new DataView(await file.slice(cdOff, cdOff+cdSize).arrayBuffer());
  const dec = new TextDecoder(); const out = []; let q = 0;
  for(let i=0;i<n;i++){
    if(cd.getUint32(q,true)!==0x02014b50) throw new Error('bad zip');
    const method = cd.getUint16(q+10,true), csize = cd.getUint32(q+20,true);
    const nlen = cd.getUint16(q+28,true), xlen = cd.getUint16(q+30,true), clen = cd.getUint16(q+32,true), lo = cd.getUint32(q+42,true);
    const name = dec.decode(new Uint8Array(cd.buffer, q+46, nlen));
    out.push({name, method, async getBlob(){
      const lhd = new DataView(await file.slice(lo, lo+30).arrayBuffer());
      const start = lo + 30 + lhd.getUint16(26,true) + lhd.getUint16(28,true);
      return file.slice(start, start+csize);
    }});
    q += 46 + nlen + xlen + clen;
  }
  return out;
}
async function exportFilesZip(btn){
  const ids = Object.keys(FILE_INFO);
  if(!ids.length){ alert('אין קבצים לגיבוי'); return; }
  const old = btn.textContent; btn.textContent = 'מכין...'; btn.disabled = true;

async function importFilesZip(file){
  try{
    const entries = await zipRead(file);
    const mf = entries.find(e=>e.name==='manifest.json');
    if(!mf) throw new Error('no manifest');
    const manifest = JSON.parse(await (await mf.getBlob()).text());
    let added = 0, skipped = 0;
    for(const e of entries){
      if(!e.name.startsWith('files/') || e.method!==0) continue;
      const id = e.name.slice(6);
      if(FILE_INFO[id]){ skipped++; continue; }
      const meta = manifest.find(m=>m.id===id); if(!meta) continue;
      const blob = (await e.getBlob()).slice(0, meta.size, meta.type||'');
      await idbPut({id, blob, meta});
      FILE_INFO[id] = meta; added++;
    }
    alert(`יובאו ${added} קבצים` + (skipped?` (${skipped} כבר היו קיימים)`:''));
    render();
  }catch(err){ alert('קובץ ZIP לא תקין'); }
}

function doBackupExport(){
  const d = new Date();
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pm-backup_${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;

function backupDue(){
  const f = getBackupFreq(); if(f==='none') return false;
  const now = new Date();
  const lastIso = localStorage.getItem('pm_last_backup');
  if(!lastIso) return f!=='workdays' || getWorkdays().includes(now.getDay());
  const last = new Date(lastIso);
  const day0 = d=> new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((day0(now) - day0(last)) / 86400000);
  if(f==='daily') return diff>=1;
  if(f==='workdays') return diff>=1 && getWorkdays().includes(now.getDay());
  if(f==='weekly') return diff>=7;
  if(f==='biweekly') return diff>=14;
  const nxt = new Date(last); nxt.setMonth(nxt.getMonth()+1);
  return now >= nxt;
}

  }

}

/* ---------- Companies helpers ---------- */
function companyChainName(c){
  if(!c) return '';
  let chain=[c.name]; let cur=c; let guard=0;
  while(cur.parentId && guard<10){
    const parent = DATA.companies.find(x=>x.id===cur.parentId);
    if(!parent) break;
    chain.push(parent.name);
    cur = parent; guard++;
  }
  return chain.join(' ⟵ ');
}
function isDescendant(companyId, potentialAncestorId){
  let cur = DATA.companies.find(c=>c.id===companyId);
  let guard=0;
  while(cur && cur.parentId && guard<10){
    if(cur.parentId===potentialAncestorId) return true;
    cur = DATA.companies.find(c=>c.id===cur.parentId);
    guard++;
  }
  return false;
}
function getContactAddress(contact){
  if(!contact) return '';
  if(contact.address) return contact.address;
  const co = DATA.companies.find(x=>x.id===contact.companyId);
  return co && co.address ? co.address : '';
}

/* ---------- Search (projects list) ---------- */
function projectMatchesQuery(project, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(project.name.toLowerCase().includes(q)) return true;
  if((project.notes||'').toLowerCase().includes(q)) return true;
  if(contactsOrCompanyMatch(project.contactIds, q)) return true;
  function walk(items){
    for(const it of items){
      if(it.title.toLowerCase().includes(q)) return true;
      if((it.desc||'').toLowerCase().includes(q)) return true;
      if(contactsOrCompanyMatch(it.contactIds, q)) return true;
      if(walk(it.children||[])) return true;
    }
    return false;
  }
  return walk(project.tasks);
}
function contactsOrCompanyMatch(ids, q){
  for(const cid of (ids||[])){
    const c = DATA.contacts.find(x=>x.id===cid);
    if(!c) continue;
    if(c.name.toLowerCase().includes(q)) return true;
    const co = DATA.companies.find(x=>x.id===c.companyId);
    if(co && companyChainName(co).toLowerCase().includes(q)) return true;
  }
  return false;
}

function getProjectsView(){ return localStorage.getItem('pm_projects_view')==='client' ? 'client' : 'project'; }
function getExpandedClients(){
  try{ return new Set(JSON.parse(localStorage.getItem('pm_client_open')||'[]')); }catch(e){ return new Set(); }
}
function setExpandedClients(set){ try{ localStorage.setItem('pm_client_open', JSON.stringify([...set])); }catch(e){} }

function companyAndDescendantIds(id){
  const ids = new Set([id]);
  let grew = true, guard = 0;
  while(grew && guard++ < 20){
    grew = false;
    for(const c of DATA.companies){
      if(c.parentId && ids.has(c.parentId) && !ids.has(c.id)){ ids.add(c.id); grew = true; }
    }
  }
  return ids;
}

function projectCardHtml(p, groupCompanyId){
  const stats = countStatus(p.tasks);
  const pco = DATA.companies.find(x=>x.id===p.companyId);
  const inGroup = groupCompanyId !== undefined;
  const subTag = (inGroup && pco && pco.id!==groupCompanyId) ? `<div class="muted">🏢 ${esc(pco.name)}</div>` : '';
  return `<div class="card" data-open="${p.id}">
    <div class="item-head">
      <h3>${companyLogoImg(pco,20)} ${esc(p.name)}</h3>
      <span class="muted">${statusLabel(p.status)}</span>
    </div>
    ${inGroup ? subTag : (pco?`<div class="muted">${esc(companyChainName(pco))}</div>`:'')}
    <div class="muted">${stats.total} משימות · ${stats.done} הושלמו${stats.overdue?` · <span style="color:var(--red)">${stats.overdue} באיחור</span>`:''}</div>
  </div>`;
}

function projectsByClientHtml(filtered){
  const expanded = getExpandedClients();
  const searching = !!searchQuery.trim();
  const groups = [];
  for(const co of DATA.companies){
    const ids = companyAndDescendantIds(co.id);
    const ps = filtered.filter(p=>ids.has(p.companyId));
    if(ps.length) groups.push({co, ps});
  }
  groups.sort((x,y)=> x.co.name.localeCompare(y.co.name, 'he'));
  // projects whose company was deleted
  const orphans = filtered.filter(p=>!DATA.companies.some(c=>c.id===p.companyId));
  const sections = [['active','פעילים'],['paused','בהמתנה'],['won','נסגרו בהצלחה'],['lost','נפסלו']];
  const groupHtml = (key, title, logo, ps, coId, sum)=>{
    const open = searching || expanded.has(key);
    const body = sections.map(([st,label])=>{
      const list = ps.filter(p=>p.status===st);
      if(!list.length) return '';
      return `<div class="muted" style="font-weight:700; margin:10px 0 4px;">${label} (${list.length})</div>` + list.map(p=>projectCardHtml(p, coId)).join('');
    }).join('');
    return `<div class="card" style="padding:0;">
      <div class="item-head" data-client-toggle="${esc(key)}" style="padding:12px 14px; cursor:pointer;">
        <h3>${open?'▾':'◂'} ${logo} ${esc(title)}</h3>
        <span class="muted">${sum}</span>
      </div>
      ${open?`<div style="padding:0 10px 10px;">${body}</div>`:''}
    </div>`;
  };
  const summary = ps=>{
    const live = ps.filter(p=>p.status==='active'||p.status==='paused');
    let openTasks = 0, overdue = 0;
    for(const p of live){ const st = countStatus(p.tasks); openTasks += st.total - st.done; overdue += st.overdue; }
    return `${ps.length} פרויקטים · ${openTasks} משימות פתוחות${overdue?` · <span style="color:var(--red)">${overdue} באיחור</span>`:''}`;
  };
  let html = groups.map(g=> groupHtml(g.co.id, g.co.name, companyLogoImg(g.co,20), g.ps, g.co.id, summary(g.ps))).join('');
  if(orphans.length) html += groupHtml('__none', 'ללא לקוח', '', orphans, null, summary(orphans));
  return html;
}

function projectsListInner(){
  let filtered = sortProjects(DATA.projects.filter(p=>projectMatchesQuery(p, searchQuery)));
  if(getHideClosed()) filtered = filtered.filter(p=>p.status!=='won' && p.status!=='lost');
  const view = getProjectsView();
  let body;
  if(filtered.length===0){
    body = `<div class="empty-state">${DATA.projects.length===0?'אין עדיין פרויקטים.<br>לחץ על + כדי להוסיף פרויקט ראשון.':'לא נמצאו תוצאות.'}</div>`;
  } else if(view==='client'){
    body = projectsByClientHtml(filtered);
  } else {
    body = filtered.map(p=>projectCardHtml(p)).join('');
  }
  return body;
}

function statusLabel(s){ return {active:'פעיל',won:'נסגר בהצלחה',lost:'נפסל',paused:'בהמתנה'}[s] || s; }

function countStatus(list){
  let total=0, done=0, overdue=0;
  const now = new Date();
  (function walk(items){
    for(const it of items){
      total++;
      if(it.status==='done') done++;
      else if(it.due && new Date(it.due) < now) overdue++;
      walk(it.children||[]);
    }
  })(list);
  return {total, done, overdue};
}

function isCollapsed(item){
  const hasChildren = (item.children||[]).length>0;
  if(!hasChildren) return false;
  if(!initializedCollapse.has(item.id)){
    initializedCollapse.add(item.id);
    if(getExpandDefault()==='collapsed') collapsedIds.add(item.id);
  }
  return collapsedIds.has(item.id);
}
function toggleCollapse(id){
  if(collapsedIds.has(id)) collapsedIds.delete(id); else collapsedIds.add(id);
  render();
}
function expandAllInProject(project){
  (function walk(items){ items.forEach(it=>{ collapsedIds.delete(it.id); initializedCollapse.add(it.id); walk(it.children||[]); }); })(project.tasks);
  render();
}
function collapseAllInProject(project){
  (function walk(items){ items.forEach(it=>{ if((it.children||[]).length){ collapsedIds.add(it.id); initializedCollapse.add(it.id);} walk(it.children||[]); }); })(project.tasks);
  render();
}
function sortedSiblings(items){
  return items.map((it,idx)=>({it,idx})).sort((a,b)=>{
    const ad = a.it.status==='done'?1:0, bd = b.it.status==='done'?1:0;
    if(ad!==bd) return ad-bd;
    const so = getSort();
    if(so==='name') return a.it.title.localeCompare(b.it.title,'he');
    if(so==='due'){ const x=a.it.due, y=b.it.due; if(x&&y&&x!==y) return x<y?-1:1; if(x&&!y) return -1; if(!x&&y) return 1; }
    return a.idx-b.idx;
  }).map(x=>x.it);
}

        removeItem(project.tasks, el.dataset.del);

  main.querySelectorAll('[data-addchild]').forEach(el=>{

function getDepth(list, id, d=1){
  for(const it of list){
    if(it.id===id) return d;
    const r = getDepth(it.children||[], id, d+1);
    if(r) return r;
  }
  return 0;
}

/* ---------- Effective completion (ancestor cascades functionally, not visually) ---------- */
function isEffectivelyDone(itemId, project){
  const path = findPathToItem(project.tasks, itemId);
  if(!path) return false;
  return path.some(it=>it.status==='done');
}

function getOverdueList(){
  const now = new Date();
  const out = [];
  for(const p of DATA.projects){
    (function walk(items, depth, doneAncestor){
      for(const it of items){
        const effDone = doneAncestor || it.status==='done';
        if(!effDone && it.due && new Date(it.due) < now){
          out.push({item: it, project: p, depth});
        }
        walk(it.children||[], depth+1, effDone);
      }
    })(p.tasks, 1, false);
  }
  out.sort((a,b)=> new Date(a.item.due) - new Date(b.item.due));
  return out;
}

/* ================= Dashboard ================= */
/* Effective date for the dashboard: the earliest of the due date and all counted reminders.
   A reminder is counted unless it was acknowledged ("אשר") from the task screen. */
function itemEffectiveDue(it){
  let best = null;
  const consider = s=>{
    if(!s) return;
    const d = new Date(s);
    if(isNaN(d.getTime())) return;
    if(!best || d < best) best = d;
  };
  consider(it.due);
  for(const r of (it.reminders||[])){
    if(r.acked) continue;
    consider(r.datetime);
  }
  return best;
}

function renderDashboard(){
  const now = new Date();
  let totalOpen=0, totalOverdue=0, totalDueSoon=0;
  const urgent = [];
  const byStatusCount = {active:0, won:0, lost:0, paused:0};
  const companyOpenCount = {};

  DATA.projects.forEach(p=> byStatusCount[p.status] = (byStatusCount[p.status]||0)+1 );

  for(const p of DATA.projects){
    (function walk(items, doneAncestor){
      for(const it of items){
        const effDone = doneAncestor || it.status==='done';
        if(!effDone){
          totalOpen++;
          const eff = itemEffectiveDue(it);
          if(eff){
            if(eff<now){ totalOverdue++; urgent.push({item:it, project:p, when:eff}); }
            else if(eff-now < 1000*60*60*24*3){ totalDueSoon++; urgent.push({item:it, project:p, when:eff}); }
          }
          // top clients: use item's primary contact, else attached contacts
          const cids = it.primaryContactId ? [it.primaryContactId] : (it.contactIds||[]);
          cids.forEach(cid=>{
            const c = DATA.contacts.find(x=>x.id===cid);
            const co = c && DATA.companies.find(x=>x.id===c.companyId);
            if(co){ companyOpenCount[co.id] = (companyOpenCount[co.id]||0)+1; }
          });
        }
        walk(it.children||[], effDone);
      }
    })(p.tasks, false);
  }
  urgent.sort((a,b)=> a.when - b.when);
  const topUrgent = urgent.slice(0,8);

  // 7 days ahead
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
    days.push(d);
  }
  const itemsByDay = days.map(d=>({date:d, items:[]}));
  for(const p of DATA.projects){
    (function walk(items, doneAncestor){
      for(const it of items){
        const effDone = doneAncestor || it.status==='done';
        const effD = effDone ? null : itemEffectiveDue(it);
        if(effD){
          const d = effD;
          for(const bucket of itemsByDay){
            if(d.getFullYear()===bucket.date.getFullYear() && d.getMonth()===bucket.date.getMonth() && d.getDate()===bucket.date.getDate()){
              bucket.items.push({item:it, project:p});
            }
          }
        }
        walk(it.children||[], effDone);
      }
    })(p.tasks, false);
  }

  // progress per project
  const progressRows = DATA.projects.map(p=>{
    const st = countStatus(p.tasks);
    const pct = st.total ? Math.round(st.done/st.total*100) : 0;
    return {p, st, pct};
  });

  // top clients
  const topClients = Object.entries(companyOpenCount).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([coId,count])=>({co: DATA.companies.find(c=>c.id===coId), count}));

  const activeDays = itemsByDay.filter(b=>b.items.length>0);

  main.innerHTML = `
    <div class="stat-grid" style="margin-bottom:10px;">
      <div class="stat-card"><div class="num">${totalOpen}</div><div class="lbl">משימות פתוחות</div></div>
      <div class="stat-card"><div class="num" style="color:var(--red)">${totalOverdue}</div><div class="lbl">באיחור</div></div>
      <div class="stat-card"><div class="num" style="color:var(--yellow)">${totalDueSoon}</div><div class="lbl">קרובות (3 ימים)</div></div>
      <div class="stat-card"><div class="num">${DATA.projects.length}</div><div class="lbl">פרויקטים</div></div>
    </div>

    <div class="card">
      <h3>🔥 הכי דחופות</h3>
      ${topUrgent.length===0?'<div class="muted">אין משימות דחופות כרגע 🎉</div>':''}
      ${topUrgent.map(({item,project,when})=>`
        <div class="row" data-goto-proj="${project.id}" data-goto-item="${item.id}" style="justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); cursor:pointer;">
          <div>
            <div style="font-weight:600; font-size:13px;">${esc(item.title)}</div>
            <div class="muted">${esc(project.name)}</div>
          </div>
          <div class="muted" style="color:${when<now?'var(--red)':'var(--yellow)'}">${fmtDate(toLocalInputValue(when))}</div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>📅 7 הימים הקרובים</h3>
      ${activeDays.length===0?'<div class="muted">אין משימות מתוכננות בשבוע הקרוב 🎉</div>':activeDays.map(b=>`
        <div class="day-block">
          <h4>${b.date.toLocaleDateString('he-IL',{weekday:'long', day:'2-digit', month:'2-digit'})}</h4>
          ${b.items.map(({item,project})=>`
            <div class="row" data-goto-proj="${project.id}" data-goto-item="${item.id}" style="justify-content:space-between; cursor:pointer;">
              <span style="font-size:13px;">${esc(item.title)}</span>
              <span class="muted">${esc(project.name)}</span>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>📊 התקדמות לפי פרויקט</h3>
      ${progressRows.length===0?'<div class="muted">אין פרויקטים</div>':progressRows.map(({p,st,pct})=>`
        <div style="margin-top:8px;">
          <div class="row" style="justify-content:space-between;">
            <span style="font-size:13px; font-weight:600;">${esc(p.name)}</span>
            <span class="muted">${st.done}/${st.total} (${pct}%)</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>🏷️ פילוח פרויקטים לפי סטטוס</h3>
      <div class="row">
        ${Object.entries(byStatusCount).map(([k,v])=>`<span class="chip">${statusLabel(k)}: ${v}</span>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3>🏢 לקוחות/חברות עם הכי הרבה משימות פתוחות</h3>
      ${topClients.length===0?'<div class="muted">אין נתונים עדיין (שייך אנשי קשר ללקוחות/חברות)</div>':topClients.map(({co,count})=>`
        <div class="row" style="justify-content:space-between; padding:4px 0;">
          <span style="font-size:13px;">${companyInline(co,18)}</span>
          <span class="muted">${count} משימות פתוחות</span>
        </div>
      `).join('')}
    </div>
  `;
  main.querySelectorAll('[data-goto-item]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentTab='projects';
      currentProjectId = el.dataset.gotoProj;
      highlightItemId = el.dataset.gotoItem;
      document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab==='projects'));
      render();
    });
  });
}

function getContactsSort(){

  if(CT_SORT_LABELS[v]) return v;

let contactsSearch = '';
function contactMatches(c, q){
  const co = DATA.companies.find(x=>x.id===c.companyId);
  const hay = [c.name, c.role, c.phone, c.email, c.address, c.notes, co&&co.name].filter(Boolean).join(' ').toLowerCase();
  if(hay.includes(q)) return true;
  const qd = q.replace(/\D/g,'');
  return qd.length>=3 && String(c.phone||'').replace(/\D/g,'').includes(qd);
}
function getOpenContactGroups(){ try{ return new Set(JSON.parse(localStorage.getItem('pm_contact_open')||'[]')); }catch(e){ return new Set(); } }

function contactsByCompanyHtml(contacts, forceOpen){
  const open = getOpenContactGroups();
  const sorted = contacts.slice().sort((a,b)=> a.name.localeCompare(b.name,'he'));
  const groups = [];
  for(const co of DATA.companies){
    const ids = companyAndDescendantIds(co.id);
    const cs = sorted.filter(c=>ids.has(c.companyId));
    if(cs.length) groups.push({key:co.id, title:co.name, logo:companyLogoImg(co,20), cs, coId:co.id, sort:co.name});
  }
  groups.sort((x,y)=> x.sort.localeCompare(y.sort,'he'));
  const orphans = sorted.filter(c=>!DATA.companies.some(x=>x.id===c.companyId));
  if(orphans.length) groups.push({key:'__none', title:'ללא חברה', logo:'', cs:orphans, coId:null});
  return groups.map(g=>{
    const isOpen = forceOpen || open.has(g.key);
    return `<div class="card" style="padding:0;">
      <div class="item-head" data-contact-group="${esc(g.key)}" style="padding:12px 14px; cursor:pointer;">
        <h3>${isOpen?'▾':'◂'} ${g.logo} ${esc(g.title)}</h3>
        <span class="muted">${g.cs.length} אנשי קשר</span>
      </div>
      ${isOpen?`<div style="padding:0 10px 10px;">${g.cs.map(c=>contactCardHtml(c, g.coId)).join('')}</div>`:''}
    </div>`;
  }).join('');
}

        ${co.address?`<div class="muted">📍 ${esc(co.address)}</div>`:''}
        ${co.notes?`<div class="muted">${esc(co.notes)}</div>`:''}
      </div>
    `).join('');
    list.querySelectorAll('[data-editco]').forEach(el=>{
      el.addEventListener('click', ()=> openCompanyModal(DATA.companies.find(c=>c.id===el.dataset.editco)));
    });
    list.querySelectorAll('[data-delco]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const co = DATA.companies.find(c=>c.id===el.dataset.delco);
        const used = DATA.contacts.some(c=>c.companyId===co.id) || DATA.companies.some(c=>c.parentId===co.id);
        if(used && !confirm('חברה זו משויכת לאנשי קשר או לחברות-בת. מחיקה תסיר את השיוך. להמשיך?')) return;
        if(!used && !confirm('למחוק לקוח/חברה זו?')) return;
        DATA.companies = DATA.companies.filter(c=>c.id!==co.id);
        DATA.contacts.forEach(c=>{ if(c.companyId===co.id) c.companyId=''; });
        DATA.companies.forEach(c=>{ if(c.parentId===co.id) c.parentId=''; });
        save(); render();
      });
    });
  }
}

        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed.projects || !parsed.contacts) throw new Error('bad format');
          if(!parsed.companies) parsed.companies = [];
          if(!parsed.quickLinks) parsed.quickLinks = [];
          if(!parsed.files) parsed.files = [];
          if(!parsed.docs) parsed.docs = [];
          if(!parsed.docCats) parsed.docCats = [];
          if(confirm('הייבוא יחליף את כל המידע הקיים. להמשיך?')){

      };
      reader.readAsText(file);
    };

      if(confirm('פעולה זו תמחק את כל הפרויקטים, המשימות, אנשי הקשר והחברות. בטוח?')){

        DATA = {projects:[], contacts:[], companies:[], quickLinks:[], files:[], docs:[], docCats:[]};
        if(wipe){ idb().then(db=>{ db.transaction('files','readwrite').objectStore('files').clear(); }); for(const k in FILE_INFO) delete FILE_INFO[k]; }
        save(); render();
      }
    };
  }

function permLabel(s){
  return {granted:'מאושר ✅', denied:'נדחה ❌', default:'טרם נשאל', unsupported:'לא נתמך'}[s] || s;
}

/* ================= Modals ================= */
function openModalEl(html, opts){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${opts&&opts.center?'center':''}">${html}</div>`;
  bg.addEventListener('click', (e)=>{ if(e.target===bg) closeModal(bg); });
  document.body.appendChild(bg);
  requestAnimationFrame(()=> bg.classList.add('show'));
  if(focusState && !focusBg) focusBg = bg;
  return bg;
}
let focusBg = null;
function closeModal(bg){
  if(!bg || !bg.parentNode) return;
  if(bg===focusBg){ focusBg = null; focusState = null; saveView(); }
  bg.classList.remove('show');
  setTimeout(()=>{ if(bg.parentNode) bg.parentNode.removeChild(bg); }, 140);
}

    <label>תזכורת חוזרת (מחושבת על בסיס תאריך היעד)</label>
    <select id="mRec">
      ${['none','daily','weekly','monthly'].map(r=>`<option value="${r}" ${isEdit&&item.recurrence===r?'selected':''}>${recLabel(r)}</option>`).join('')}
    </select>
    <label>תזכורות נוספות</label>
    <div id="remList"></div>
    <button class="btn small secondary" id="addRem" style="margin-top:4px;">+ הוסף תזכורת</button>
    <label style="margin-top:10px;">אנשי קשר</label>
    <div id="mContactsWrap"></div>
    <button class="btn small secondary" id="mAddContact" style="margin-top:4px;">+ הוסף איש קשר</button>
    <label>איש קשר ראשי</label>
    <select id="mPrimary"></select>
    <label style="margin-top:10px;">יומן Google</label>
    <label class="row" style="cursor:pointer;">
      <input type="checkbox" id="mAddGcal" style="width:auto;"> פתח הוספה ליומן בעת השמירה
    </label>
    <button class="btn small secondary" id="mGcalNow" type="button" style="margin-top:4px;" >📅 הוסף ליומן עכשיו</button>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="mSave">שמירה</button>
      <button class="btn secondary" id="mCancel">ביטול</button>
      ${isEdit?'<button class="btn danger" id="mDelete">מחיקה</button>':''}
    </div>
  `);
  function renderPrimarySelect(){
    const sel = bg.querySelector('#mPrimary');
    sel.innerHTML = `<option value="">ללא</option>` + workingContactIds.map(cid=>{
      const c = DATA.contacts.find(x=>x.id===cid);
      return c?`<option value="${cid}" ${isEdit&&item.primaryContactId===cid?'selected':''}>${esc(c.name)}</option>`:'';
    }).join('');
  }
  function renderReminders(){
    const days = orderedDayIndices();
    bg.querySelector('#remList').innerHTML = workingReminders.map((r,i)=>`
      <div class="card" style="padding:8px; margin-top:6px;">
        <div class="reminder-row">
          <input type="datetime-local" data-rem-dt="${i}" value="${r.datetime||''}">
          <button class="icon-btn" data-rem-rm="${i}">🗑️</button>
        </div>
        <label class="row" style="margin-top:4px; cursor:pointer;">
          <input type="checkbox" style="width:auto;" data-rem-recurring="${i}" ${r.recurring?'checked':''}> חזרתית
        </label>
        ${r.recurring?`
          <select data-rem-type="${i}" style="margin-top:4px;">
            ${[['daily','יומי'],['weekly','שבועי'],['monthly','חודשי'],['workdays','ימי עבודה'],['weekend','סוף שבוע'],['custom','ימים ספציפיים']].map(([v,l])=>`<option value="${v}" ${r.recType===v?'selected':''}>${l}</option>`).join('')}
          </select>
          ${r.recType==='custom'?`
            <div class="row" style="margin-top:4px;">
              ${days.map(d=>`<button type="button" class="btn small ${((r.customDays||[]).includes(d))?'':'secondary'}" data-rem-day="${i}-${d}">${DAY_SHORT[d]}</button>`).join('')}
            </div>
          `:''}
        `:''}
      </div>
    `).join('') || '<div class="muted">אין תזכורות נוספות</div>';
    bg.querySelectorAll('[data-rem-dt]').forEach(inp=> inp.onchange = ()=>{ const r = workingReminders[+inp.dataset.remDt]; if(r.datetime !== inp.value){ r.datetime = inp.value; r.notified = false; r.acked = false; } });
    bg.querySelectorAll('[data-rem-rm]').forEach(b=> b.onclick = ()=>{ workingReminders.splice(+b.dataset.remRm,1); renderReminders(); });
    bg.querySelectorAll('[data-rem-recurring]').forEach(cb=> cb.onchange = ()=>{
      const r = workingReminders[+cb.dataset.remRecurring];
      r.recurring = cb.checked;
      if(cb.checked && !r.recType) r.recType='daily';
      renderReminders();
    });
    bg.querySelectorAll('[data-rem-type]').forEach(sel=> sel.onchange = ()=>{ workingReminders[+sel.dataset.remType].recType = sel.value; renderReminders(); });
    bg.querySelectorAll('[data-rem-day]').forEach(btn=> btn.onclick = ()=>{
      const [i,d] = btn.dataset.remDay.split('-').map(Number);
      const r = workingReminders[i];
      r.customDays = r.customDays || [];
      const pos = r.customDays.indexOf(d);
      if(pos>-1) r.customDays.splice(pos,1); else r.customDays.push(d);
      renderReminders();
    });
  }
  renderReminders();
  bg.querySelector('#addRem').onclick = ()=>{
    workingReminders.push({id:uid(), datetime:'', notified:false, recurring:false, recType:'daily', customDays:[]});
    renderReminders();
  };
  function renderChips(){
    bg.querySelector('#mContactsWrap').innerHTML = workingContactIds.map(cid=>{
      const c = DATA.contacts.find(x=>x.id===cid);
      return c?`<span class="chip">👤 ${esc(c.name)} <button data-rm="${cid}">✕</button></span>`:'';
    }).join('') || '<span class="muted">אין אנשי קשר משויכים</span>';
    bg.querySelectorAll('[data-rm]').forEach(b=>{
      b.onclick = ()=>{ workingContactIds = workingContactIds.filter(id=>id!==b.dataset.rm); renderChips(); renderPrimarySelect(); };
    });
    renderPrimarySelect();
  }
  renderChips();
  bg.querySelector('#mAddContact').onclick = ()=>{
    openAttachContactModal(workingContactIds, (newIds)=>{ workingContactIds = newIds; renderChips(); });
  };
  bg.querySelector('#mGcalNow').onclick = ()=>{
    const due = bg.querySelector('#mDue').value;
    const tempItem = { id: isEdit?item.id:'', location: bg.querySelector('#mLocation').value.trim(), title: bg.querySelector('#mTitle').value.trim()||'(ללא כותרת)', desc: bg.querySelector('#mDesc').value, due, recurrence: bg.querySelector('#mRec').value, reminders: workingReminders.filter(r=>r.datetime), contactIds: workingContactIds, primaryContactId: bg.querySelector('#mPrimary').value };
    const url = gcalLink(tempItem, project);
    if(url) window.open(url, '_blank');
  };
  bg.querySelector('#mCancel').onclick = ()=> closeModal(bg);
  bg.querySelector('#mSave').onclick = ()=>{
    const title = bg.querySelector('#mTitle').value.trim();
    if(!title){ alert('נא להזין כותרת'); return; }
    const due = bg.querySelector('#mDue').value;
    const rec = bg.querySelector('#mRec').value;
    const desc = bg.querySelector('#mDesc').value;
    const loc = bg.querySelector('#mLocation').value.trim();
    const primary = bg.querySelector('#mPrimary').value;
    const addGcal = bg.querySelector('#mAddGcal').checked;
    const cleanReminders = workingReminders.filter(r=>r.datetime).map(r=>({
      id: r.id||uid(), datetime: r.datetime, notified: !!r.notified, acked: !!r.acked,
      recurring: !!r.recurring, recType: r.recurring?(r.recType||'daily'):'none',
      customDays: r.customDays||[]
    }));
    let savedItem;
    if(isEdit){
      item.title=title; item.desc=desc; item.location=loc; item.due=due; item.recurrence=rec; item.contactIds=workingContactIds;
      item.primaryContactId=primary; item.reminders=cleanReminders;
      savedItem = item;
    } else {
      const it = newItem(title);
      it.desc=desc; it.location=loc; it.due=due; it.recurrence=rec; it.contactIds=workingContactIds;
      it.primaryContactId=primary; it.reminders=cleanReminders;
      parentList.push(it);
      savedItem = it;
    }
    save(); closeModal(bg); render();
    if(addGcal){
      const url = gcalLink(savedItem, project);
      if(url) window.open(url, '_blank');
    }
  };
  if(isEdit){
    bg.querySelector('#mDelete').onclick = ()=>{
      if(confirm('למחוק פריט זה וכל תתי-הפריטים?')){
        removeItem(project.tasks, item.id);
        save(); closeModal(bg); render();
      }
    };
  }
}

/* ================= Focus mode ================= */
function openFocusModal(itemId, project, opts){
  const item = findItem(project.tasks, itemId);
  if(!item) return;
  const depth = getDepth(project.tasks, item.id);
  const label = ['','משימה','תת-משימה','תת-תת-משימה'][depth] || 'פריט';
  const statusText = item.status==='done' ? 'הושלם' : (item.due && new Date(item.due) < new Date() ? 'באיחור' : 'פתוח');
  const children = sortedSiblings(item.children||[]);
  const primary = item.primaryContactId ? DATA.contacts.find(c=>c.id===item.primaryContactId) : null;

  focusState = {itemId: item.id, projectId: project.id};
  saveView();
  const bg = openModalEl(`
    ${opts && opts.snooze ? '<div id="fcSnooze"></div>' : ''}
    <div class="muted">${label} · ${statusText}</div>
    <h2>${esc(item.title)}</h2>
    ${item.desc?`<div class="muted" style="white-space:pre-wrap;">${esc(item.desc)}</div>`:''}
    ${item.location?`<div class="muted" style="margin-top:6px;">📍 ${esc(item.location)}</div>`:''}
    ${item.due?`<div class="muted" style="margin-top:6px;">⏰ ${fmtDate(item.due)}${item.recurrence!=='none'?` · 🔁 ${recLabel(item.recurrence)}`:''}</div>`:''}
    ${(item.reminders||[]).length?'<div id="fcRems" style="margin-top:4px;"></div>':''}
    ${item.contactIds && item.contactIds.length?`<div style="margin-top:8px;">${renderContactChips(item.contactIds)}</div>`:''}
    ${primary?`<div class="muted" style="margin-top:4px;">⭐ איש קשר ראשי: ${esc(primary.name)}</div>`:''}

    <label style="margin-top:14px;">קבצים</label>
    <div id="fcFiles"></div>
    <label style="margin-top:14px;">עדכונים</label>
    <div id="fcUpdates"></div>
    <button class="btn small secondary" id="fcAddUpd" style="margin-top:6px;">+ הוסף עדכון</button>
    ${createdLineHtml(item)}

    ${children.length?`
      <label style="margin-top:14px;">תת-פריטים (${children.length})</label>
      <div id="focusChildren"></div>
    `:''}

    <div class="row" style="margin-top:16px;">
      <button class="btn" id="fcEdit">✏️ עריכה</button>
      <button class="btn secondary" id="fcToggle">${item.status==='done'?'↩️ סמן כפתוח':'✅ סמן כהושלם'}</button>
      ${depth<3?`<button class="btn secondary" id="fcAddChild">+ הוסף ${['','תת-משימה','תת-תת-משימה'][depth]}</button>`:''}
      <button class="btn secondary" id="fcGcal">📅 יומן</button>
      <button class="btn danger" id="fcDelete">🗑️ מחיקה</button>
    </div>
  `);
  if(opts && opts.snooze){
    const box = bg.querySelector('#fcSnooze');
    const confirmed = at=>{ box.innerHTML = `<div class="card" style="padding:8px;">✅ ההתראה נדחתה ל-${fmtDate(at)}</div>`; };
    box.innerHTML = `<div class="card" style="padding:8px; border-color:var(--accent);">
      <div style="font-weight:700; font-size:13px;">⏰ דחיית ההתראה</div>
      <div class="muted" style="font-size:11px;">לא משנה את תאריך היעד של המשימה</div>
      <div class="row" style="margin-top:6px;">
        <button class="btn small secondary" data-snz="15">15 דק׳</button>
        <button class="btn small secondary" data-snz="60">שעה</button>
        <button class="btn small secondary" data-snz="180">3 שעות</button>
        <button class="btn small secondary" data-snz="tom">מחר 9:00</button>
        <button class="btn small secondary" data-snz="pick">בחר זמן</button>
      </div></div>`;
    box.querySelectorAll('[data-snz]').forEach(b=> b.onclick = ()=>{
      const v = b.dataset.snz;
      if(v==='tom'){ const t = new Date(); t.setDate(t.getDate()+1); t.setHours(9,0,0,0); confirmed(snoozeItem(project.id, item.id, 0, toLocalInputValue(t))); }
      else if(v==='pick'){
        const def = toLocalInputValue(new Date(Date.now()+3600000));
        const pb = openModalEl(`<h2>דחיית ההתראה עד</h2><input id="snzAt" type="datetime-local" value="${def}"><div class="row" style="margin-top:12px;"><button class="btn" id="snzOk">אישור</button><button class="btn secondary" id="snzNo">ביטול</button></div>`, {center:true});
        pb.querySelector('#snzNo').onclick = ()=> closeModal(pb);
        pb.querySelector('#snzOk').onclick = ()=>{
          const val = pb.querySelector('#snzAt').value;
          if(!val || new Date(val) <= new Date()){ alert('נא לבחור זמן עתידי'); return; }
          closeModal(pb); confirmed(snoozeItem(project.id, item.id, 0, val));
        };
      } else confirmed(snoozeItem(project.id, item.id, parseInt(v,10)));
    });
  }
  function drawReminders(){
    const box = bg.querySelector('#fcRems');
    if(!box) return;
    const list = (item.reminders||[]).filter(r=>r.datetime).slice().sort((a,b)=> new Date(a.datetime)-new Date(b.datetime));
    box.innerHTML = list.map(r=>{
      const pending = r.notified && !r.recurring && !r.acked;
      return `<div class="row" style="justify-content:space-between; gap:6px; margin-top:3px;">
        <span class="muted">🔔 ${fmtDate(r.datetime)}${r.recurring?' · 🔁':''}${r.acked?' · ✓ אושרה':''}</span>
        ${pending?`<button class="btn small secondary" data-rem-ack="${r.id}">✓ אשר</button>`:''}
      </div>`;
    }).join('');
    box.querySelectorAll('[data-rem-ack]').forEach(b=> b.onclick = ()=>{
      const r = (item.reminders||[]).find(x=>x.id===b.dataset.remAck);
      if(r){ r.acked = true; save(); drawReminders(); render(); }
    });
  }
  drawReminders();
  let showAllUpd = false;
  function drawUpdates(){
    const all = updatesSorted(item);
    const shown = showAllUpd ? all : all.slice(0,3);
    bg.querySelector('#fcUpdates').innerHTML = shown.map(u=>`
      <div class="card" style="padding:8px; margin-top:6px;">
        <div class="item-head"><span class="muted">${fmtDate(u.at)}</span>
          <span class="row" style="gap:2px;"><button class="icon-btn" data-upd-edit="${u.id}">✏️</button><button class="icon-btn" data-upd-del="${u.id}">🗑️</button></span></div>
        <div style="white-space:pre-wrap; font-size:13px;">${esc(u.text)}</div>
        <div data-upd-files="${u.id}" style="margin-top:6px;"></div>
      </div>`).join('') || '<div class="muted">אין עדכונים</div>';
    if(all.length>3){
      bg.querySelector('#fcUpdates').insertAdjacentHTML('beforeend', `<button class="btn small secondary" id="updMore" style="margin-top:6px;">${showAllUpd?'הצג פחות':`הצג הכול (${all.length})`}</button>`);
      bg.querySelector('#updMore').onclick = ()=>{ showAllUpd=!showAllUpd; drawUpdates(); };
    }
    bg.querySelectorAll('[data-upd-files]').forEach(el=> mountFiles(el, {projectId:project.id, itemId:item.id, updateId:el.dataset.updFiles}));
    bg.querySelectorAll('[data-upd-edit]').forEach(b=> b.onclick = ()=> openUpdateModal(item, item.updates.find(x=>x.id===b.dataset.updEdit), ()=>{ drawUpdates(); render(); }));
    bg.querySelectorAll('[data-upd-del]').forEach(b=> b.onclick = ()=>{
      if(confirm('למחוק את העדכון?')){ item.updates = item.updates.filter(x=>x.id!==b.dataset.updDel); save(); drawUpdates(); render(); }
    });
  }
  drawUpdates();
  mountFiles(bg.querySelector('#fcFiles'), {projectId:project.id, itemId:item.id});
  bg.querySelector('#fcAddUpd').onclick = ()=> openUpdateModal(item, null, ()=>{ drawUpdates(); render(); });
  if(children.length){
    bg.querySelector('#focusChildren').innerHTML = children.map(c=>`
      <div class="card" data-focus-child="${c.id}" style="cursor:pointer; margin-top:6px;">
        <div class="item-head">
          <span style="font-size:13px; font-weight:600;">${c.status==='done'?'✅ ':''}${esc(c.title)}</span>
          <span class="muted">${c.due?fmtDate(c.due):''}</span>
        </div>
      </div>
    `).join('');
    bg.querySelectorAll('[data-focus-child]').forEach(el=>{
      el.addEventListener('click', ()=>{
        closeModal(bg);
        setTimeout(()=> openFocusModal(el.dataset.focusChild, project), 150);
      });
    });
  }
  bg.querySelector('#fcEdit').onclick = ()=>{ closeModal(bg); openItemModal({item, project}); };
  bg.querySelector('#fcToggle').onclick = ()=>{
    item.status = item.status==='done' ? 'open' : 'done';
    save(); closeModal(bg); render();
  };
  const addChildBtn = bg.querySelector('#fcAddChild');
  if(addChildBtn) addChildBtn.onclick = ()=>{ closeModal(bg); openItemModal({parentList:item.children, depth:depth+1, project}); };
  const gcalBtn = bg.querySelector('#fcGcal');
  if(gcalBtn) gcalBtn.onclick = ()=>{ const url = gcalLink(item, project); if(url) window.open(url,'_blank'); };
  bg.querySelector('#fcDelete').onclick = ()=>{
    if(confirm('למחוק פריט זה וכל תתי-הפריטים?')){
      removeItem(project.tasks, item.id);
      save(); closeModal(bg); render();
    }
  };
}

function openUpdateModal(item, upd, onDone){
  const isEdit = !!upd;
  const bg = openModalEl(`
    <h2>${isEdit?'עריכת עדכון':'עדכון חדש'}</h2>
    <label>תאריך ושעה</label>
    <input id="uAt" type="datetime-local" value="${isEdit?upd.at:toLocalInputValue(new Date())}">
    <label>טקסט</label>
    <textarea id="uText" rows="4">${isEdit?esc(upd.text):''}</textarea>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="uSave">שמירה</button>
      <button class="btn secondary" id="uCancel">ביטול</button>
    </div>
  `);
  bg.querySelector('#uCancel').onclick = ()=> closeModal(bg);
  bg.querySelector('#uSave').onclick = ()=>{
    const text = bg.querySelector('#uText').value.trim();
    if(!text){ alert('נא להזין טקסט'); return; }
    const at = bg.querySelector('#uAt').value || toLocalInputValue(new Date());
    if(!item.updates) item.updates = [];
    if(isEdit){ upd.text = text; upd.at = at; }
    else item.updates.push({id: uid(), text, at});
    save(); closeModal(bg); onDone();
  };
}

      `<option value="${co.id}" ${selectedId===co.id?'selected':''}>${esc(companyChainName(co))}</option>`
    ).join('');
  }
  fillCompanySelect(isEdit?contact.companyId:'');
  const mgrSel = bg.querySelector('#cManager');
  mgrSel.innerHTML = `<option value="">ללא</option>` + DATA.contacts
    .filter(c=> !isEdit || c.id!==contact.id)
    .map(c=>{ const mco = DATA.companies.find(x=>x.id===c.companyId); return `<option value="${c.id}" ${isEdit&&contact.managerId===c.id?'selected':''}>${esc(c.name)}${mco?' – '+esc(mco.name):''}</option>`; }).join('');
  bg.querySelector('#cAddCompany').onclick = ()=>{
    openCompanyModal(null, (newCo)=>{ fillCompanySelect(newCo.id); });

      name, role: bg.querySelector('#cRole').value, companyId: bg.querySelector('#cCompany').value,
      managerId: bg.querySelector('#cManager').value,
      phone: bg.querySelector('#cPhone').value, email: bg.querySelector('#cEmail').value,
      address: bg.querySelector('#cAddress').value, notes: bg.querySelector('#cNotes').value
    };

    let created = null;
    if(!isEdit){ created = {id: uid(), ...vals}; DATA.contacts.push(created); }
    save(); closeModal(bg); render();
    if(created && onSaved) onSaved(created);
  };
}
